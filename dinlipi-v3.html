:root{--bg:#fbf5e6;--card:#eadfc8;--ink:#3b2a1a;--br:#6b4a2f;--mut:#8a7258;--ln:#cdbb9a;--font:SolaimanLipi;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c14;--card:#33281d;--ink:#fbf5e6;--br:#d2b48c;--mut:#b9a486;--ln:#4d3d2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241c14;--card:#33281d;--ink:#fbf5e6;--br:#d2b48c;--mut:#b9a486;--ln:#4d3d2c;color-scheme:dark}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font),sans-serif;font-size:17px}
#main{max-width:620px;margin:0 auto;padding:14px 12px 96px}
h1{font-size:26px;margin:6px 0 2px;color:var(--br)}h2{font-size:20px;color:var(--br);margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin:8px 0;border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid .card{margin:0;text-align:center}.grid b{display:block;font-size:24px;color:var(--br)}
button,select,input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.btn{background:var(--br);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.o{background:transparent;color:var(--br);border:1px solid var(--br)}.btn.r{background:#9b3b2e;color:#fff}
input[type=text],input[type=search],input[type=password],select,.ta{width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:14px 4px;background:none;border:0;font-size:15px;color:var(--mut);cursor:pointer}nav button.on{color:var(--br);border-top:3px solid var(--br);font-weight:bold}
.item{cursor:pointer}.item b{color:var(--br)}
.page{position:relative;margin:0 auto 14px;background-size:100% 100%;background-repeat:no-repeat;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.page textarea{position:absolute;border:0;padding:0;margin:0;background:transparent;resize:none;overflow:hidden;outline:none;color:#3b2a1a;font-family:var(--font),sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--ln);background:var(--bg);border-radius:8px;cursor:pointer}.cal .h{border:0;background:none;color:var(--mut);aspect-ratio:auto}
.cal .has{background:var(--card);font-weight:bold}.cal .sel{outline:2px solid var(--br)}
.th{display:flex;gap:8px;overflow-x:auto}.th button{border:2px solid var(--ln);padding:0;background:none;border-radius:6px;flex:0 0 70px}.th img{width:100%;display:block;border-radius:4px}.th .on{border-color:var(--br)}
.ph img{height:90px;border-radius:6px;margin:3px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
@media print{nav,.noprint{display:none!important}.page{box-shadow:none;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}}

body{font-family:var(--ui,SolaimanLipi),sans-serif;letter-spacing:.1px}
h1{font-size:28px;text-align:center;border-bottom:2px double var(--ln);padding-bottom:6px}
.card{box-shadow:0 1px 0 var(--ln),0 3px 8px rgba(80,50,20,.12);border-left:4px solid var(--br)}
#main>*{animation:fi .28s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{box-shadow:0 2px 4px rgba(60,40,20,.25)}.btn.o.sel2{background:var(--br);color:var(--bg)}
nav button span{display:block;font-size:20px;line-height:1}nav button{padding:8px 2px;font-size:12px}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--br);color:var(--bg);font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.35);z-index:6}
body.v-ed #fab,body.typing #fab{display:none}body.typing nav{display:none}body.typing #main{padding-bottom:30px}
#kbx{display:none;position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:7;padding:8px 12px}body.typing #kbx{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips .btn{padding:6px 10px;font-size:14px}
.page.turn{transform-origin:left center;animation:tp .6s ease both}@keyframes tp{from{transform:perspective(900px) rotateY(-22deg);opacity:.3}to{transform:none;opacity:1}}
:root[data-theme=dark] .page{background-color:#8c7b60;background-blend-mode:multiply}:root[data-theme=dark] .page textarea{color:#1e140a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .page{background-color:#8c7b60;background-blend-mode:multiply}:root:not([data-theme=light]) .page textarea{color:#1e140a}}
.fg{margin:10px 0;text-align:center}.fg img{max-width:100%;max-height:260px;border-radius:6px}.fg input{margin:6px 0}
#iv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:10px}#iv img{max-width:100%;max-height:85%}
.br{display:flex;align-items:center;gap:8px;margin:4px 0}.br span{flex:0 0 64px;font-size:13px}.br i{height:14px;background:var(--br);border-radius:4px;display:block}.br b{font-size:13px}
mark{background:#e8c96a;color:#3b2a1a}
#sp,#lock{overflow:hidden;gap:10px;text-align:center}#sp{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}#sp.out{opacity:0}
#sp>*,#lock>*{position:relative;z-index:1}#sp>.orbs,#lock>.orbs{position:absolute;inset:0;z-index:0}
.orbs i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.5;animation:fl 7s ease-in-out infinite alternate}.orbs i:nth-child(1){width:240px;height:240px;background:#f2a65a;left:-60px;top:8%}.orbs i:nth-child(2){width:260px;height:260px;background:#c98a5a;right:-80px;bottom:6%;animation-delay:-3s}.orbs i:nth-child(3){width:180px;height:180px;background:#f6d9a8;left:35%;top:55%;animation-delay:-5s}
@keyframes fl{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-50px) scale(1.25)}}
.lg{color:var(--br);filter:drop-shadow(0 6px 16px rgba(120,70,20,.35))}.lg .d{fill:none;stroke:var(--br);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.3s ease forwards}.lg .d2{animation-delay:.45s}.lg .d3{animation-delay:.9s}
.lg .sp{fill:#f2a65a;transform-box:fill-box;transform-origin:center;animation:pop .6s 1.3s both,tw 2.2s 1.9s ease-in-out infinite}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}@keyframes tw{50%{transform:scale(1.35) rotate(20deg);opacity:.8}}
h1.tt{border:0;margin:6px 0 0;padding:0;font-size:44px;letter-spacing:1px;text-shadow:0 4px 18px rgba(232,135,58,.35)}.tt span{display:inline-block;opacity:0;transform:translateY(22px) scale(.9);filter:blur(7px);animation:rv .8s cubic-bezier(.2,.8,.2,1) forwards}.tt span:nth-child(1){animation-delay:.9s}.tt span:nth-child(2){animation-delay:1.05s}.tt span:nth-child(3){animation-delay:1.2s}.tt span:nth-child(4){animation-delay:1.35s}
@keyframes rv{to{opacity:1;transform:none;filter:none}}.tg{margin:0;color:var(--mut);opacity:0;letter-spacing:2px;animation:fi 1s 1.7s forwards}
.bar{display:block;width:120px;height:3px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:20px}.bar u{display:block;height:100%;background:var(--br);transform:translateX(-100%);animation:ld 2.2s .3s ease forwards}@keyframes ld{to{transform:none}}
.lf{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;opacity:0;animation:fi .7s 1.5s forwards}#lock{transition:opacity .4s,transform .4s}#lock.out{opacity:0;transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){.orbs i,.lg .sp{animation:none}}

@media print{#fab,#kbx{display:none!important}}
#lock .okm{display:none;text-align:center}#lock.ok .okm{display:block;animation:pop .5s both}#lock.ok .lf{display:none}.okm p{margin:6px 0 0;font-size:22px;color:var(--br);animation:fi .6s .5s both}.okm .d{fill:none;stroke:var(--br);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .6s ease forwards}.okm .d2{animation-delay:.45s}
